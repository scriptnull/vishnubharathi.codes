keywords:
author: Vishnu Bharathi
language: en
timezone: Asia/Kolkata

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://vishnubharathi.codes
root: /
permalink: blog/:title/
permalink_defaults:
  lang: en

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# highlight:
#   enable: true
#   line_number: false
#   auto_detect: false
#   tab_replace:

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 100
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: cactus

theme_config:
  # available schemes: dark, light, white and classic
  colorscheme: white
  tags_overview: true
  nav:
    🏠 Home: /
    ✏️ Blog: /archives/
  social_links: null

  gravatar:
    email: vishnubharathi04@gmail.com
  logo:
    enabled: true
    width: 50
    height: 50
    gravatar: true
  favicon:
    desktop:
      gravatar: true
    android:
      gravatar: true
    apple:
      gravatar: true
  cloudflare_analytics:
    enabled: true
    token: "3a998e7dd4534719a1186cd0b01043fc"

feed:
  type: atom
  path: atom.xml
  limit: 5
  hub:
  content: true
  order_by: -date

# leaving rss empty uses hexo-generator-feed
rss:

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type:
